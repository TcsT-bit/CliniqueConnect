<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CliniqueConnect - SA Public Health Access</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// Simple hash for POPIA compliance - never store raw ID
const hashID = async (id) => {
  const msgBuffer = new TextEncoder().encode(id);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 12);
};

const DEMO_CLINICS = [
  {id: 1, name: "Chris Hani Baragwanath Hospital", province: "Gauteng", city: "Soweto", queue: 45, doctors: 8, medsInStock: true},
  {id: 2, name: "Charlotte Maxeke Hospital", province: "Gauteng", city: "Johannesburg", queue: 32, doctors: 12, medsInStock: true},
  {id: 3, name: "Groote Schuur Hospital", province: "Western Cape", city: "Cape Town", queue: 28, doctors: 15, medsInStock: true},
  {id: 4, name: "King Edward VIII Hospital", province: "KZN", city: "Durban", queue: 52, doctors: 6, medsInStock: false},
  {id: 5, name: "Steve Biko Academic Hospital", province: "Gauteng", city: "Pretoria", queue: 19, doctors: 10, medsInStock: true},
  {id: 8, name: "Polokwane Hospital", province: "Limpopo", city: "Polokwane", queue: 41, doctors: 7, medsInStock: false},
];

function App() {
  const [view, setView] = useState('patient');
  const [clinics, setClinics] = useState(DEMO_CLINICS);
  const [selectedClinic, setSelectedClinic] = useState(null);
  const [bookings, setBookings] = useState([]);
  const [provinceFilter, setProvinceFilter] = useState('All');
  const [user, setUser] = useState(null);
  const [symptomResult, setSymptomResult] = useState(null);
  const [stockLog, setStockLog] = useState([]);
  const [staffLog, setStaffLog] = useState([]);
  const [consentGiven, setConsentGiven] = useState(false);
  const [mode, setMode] = useState('app'); // app, ussd, whatsapp
  const [savedRands, setSavedRands] = useState(0);

  const filteredClinics = provinceFilter === 'All' ? clinics : clinics.filter(c => c.province === provinceFilter);

  const registerUser = async (id, phone) => {
    if(!consentGiven){ alert('Please accept POPIA consent first'); return; }
    const hashedID = await hashID(id);
    setUser({hashedID, phone, fileId: 'FILE' + Math.random().toString(36).substr(2, 6).toUpperCase()});
    alert('Digital file created! File ID: ' + user?.fileId);
  };

  const runSymptomCheck = (answers) => {
    const score = answers.filter(a => a === 'yes').length;
    let result = score >= 4 ? 'RED' : score >= 2 ? 'YELLOW' : 'GREEN';
    setSymptomResult(result);
    alert(`Symptom Check Result: ${result}\n\nDISCLAIMER: This is NOT medical advice. For emergencies call 112.`);
  };

  const bookSlot = (clinicId, delivery=false) => {
    if(!user) { alert('Please register first'); return; }
    const newBooking = {
      id: Date.now(),
      clinicId,
      userId: user.fileId,
      time: '10:30 AM',
      qr: 'QR' + Math.random().toString(36).substr(2, 9).toUpperCase(),
      status: 'Booked',
      deliveryType: delivery ? 'Spaza Pickup' : 'Clinic Visit'
    };
    setBookings([...bookings, newBooking]);
    setSavedRands(savedRands + 120); // Avg cost saved per avoided queue
    alert(`${newBooking.deliveryType} booked! ${delivery?'':'Show QR: ' + newBooking.qr}`);
  };

  const syncDHIS2 = () => {
    alert('DHIS2 Sync: Pulled 50 facilities, pushed 120 bookings. Endpoint: /api/dhis2/sync');
  };

  return (
    <div className="min-h-screen bg-gray-50">
      <div className="bg-red-600 text-white text-center py-2 text-sm font-semibold">
        ⚠️ EMERGENCY? Call 112. This app is not for emergencies.
      </div>

      <header className="bg-blue-700 text-white p-4 shadow-lg">
        <div className="max-w-6xl mx-auto flex justify-between items-center flex-wrap">
          <div>
            <h1 className="text-2xl font-bold">CliniqueConnect</h1>
            <p className="text-xs opacity-80">Hosted in AWS Cape Town | POPIA Compliant</p>
          </div>
          <div className="flex gap-2 flex-wrap mt-2 md:mt-0">
            <button onClick={() => setView('patient')} className={`px-3 py-2 rounded text-sm ${view==='patient'?'bg-blue-900':''}`}>Patient</button>
            <button onClick={() => setView('clinic')} className={`px-3 py-2 rounded text-sm ${view==='clinic'?'bg-blue-900':''}`}>Clinic</button>
            <button onClick={() => setView('doh')} className={`px-3 py-2 rounded text-sm ${view==='doh'?'bg-blue-900':''}`}>DOH Dashboard</button>
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto p-4">

        {view === 'patient' && (
          <div className="space-y-6">
            
            <div className="bg-yellow-50 border-yellow-300 p-4 rounded-lg">
              <p className="text-sm"><strong>Access Mode:</strong></p>
              <div className="flex gap-2 mt-2">
                <button onClick={()=>setMode('app')} className={`px-3 py-1 rounded ${mode==='app'?'bg-blue-600 text-white':''}`}>Smartphone App</button>
                <button onClick={()=>setMode('ussd')} className={`px-3 py-1 rounded ${mode==='ussd'?'bg-blue-600 text-white':''}`}>USSD *120*123#</button>
                <button onClick={()=>setMode('whatsapp')} className={`px-3 py-1 rounded ${mode==='whatsapp'?'bg-blue-600 text-white':''}`}>WhatsApp</button>
              </div>
            </div>

            {!user && (
              <div className="bg-white p-6 rounded-lg shadow">
                <h2 className="text-xl font-bold mb-4">1. Register from Home</h2>
                
                <div className="bg-blue-50 p-3 rounded mb-4">
                  <label className="flex items-start gap-2">
                    <input type="checkbox" checked={consentGiven} onChange={(e)=>setConsentGiven(e.target.checked)}/>
                    <span className="text-sm">I consent to CliniqueConnect processing my data under POPIA. Data stored in South Africa. I can request deletion anytime. 
                    <a href="#" className="text-blue-600 underline"> Read POPIA Notice</a></span>
                  </label>
                </div>

                <div className="grid md:grid-cols-2 gap-4">
                  <input id="idInput" placeholder="SA ID Number" className="p-3 border rounded"/>
                  <input id="phoneInput" placeholder="Phone Number" className="p-3 border rounded"/>
                </div>
                <p className="text-xs text-gray-500 mt-2">Note: ID is hashed. We never store raw ID numbers.</p>
                <button 
                  onClick={() => registerUser(document.getElementById('idInput').value, document.getElementById('phoneInput').value)}
                  className="mt-4 bg-blue-600 text-white px-6 py-2 rounded"
                >
                  Create Digital File
                </button>
              </div>
            )}

            {user && (
              <div className="bg-green-50 p-4 rounded-lg">
                <p className="font-semibold">Logged in as: {user.fileId}</p>
                <p className="text-sm">Data encrypted. Hosted in SA.</p>
              </div>
            )}

            <div className="bg-white p-6 rounded-lg shadow">
              <h2 className="text-xl font-bold mb-4">2. Symptom Checker</h2>
              <p className="text-sm text-gray-600 mb-2">Answer 5 questions. Get guidance on urgency. NOT a diagnosis.</p>
              <p className="text-xs text-red-600 mb-4">If you have chest pain or trouble breathing, call 112 now.</p>
              <div className="space-y-2">
                {['Difficulty breathing?', 'Chest pain?', 'High fever >38°C?', 'Severe bleeding?', 'Unconscious?'].map((q, i) => (
                  <div key={i} className="flex justify-between items-center">
                    <span>{q}</span>
                    <select id={`q${i}`} className="border p-2 rounded">
                      <option value="no">No</option>
                      <option value="yes">Yes</option>
                    </select>
                  </div>
                ))}
              </div>
              <button 
                onClick={() => runSymptomCheck([0,1,2,3,4].map(i => document.getElementById(`q${i}`).value))}
                className="mt-4 bg-orange-600 text-white px-6 py-2 rounded"
              >
                Check Symptoms
              </button>
              {symptomResult && <div className={`mt-3 p-3 rounded font-bold ${symptomResult==='RED'?'bg-red-100 text-red-700':symptomResult==='YELLOW'?'bg-yellow-100 text-yellow-700':'bg-green-100 text-green-700'}`}>Result: {symptomResult} - {symptomResult==='RED'?'Go to ER now':symptomResult==='YELLOW'?'See doctor today':'Book routine slot'}</div>}
            </div>

            <div className="bg-white p-6 rounded-lg shadow">
              <h2 className="text-xl font-bold mb-4">3. Find Clinic & Book</h2>
              <select
                value={provinceFilter}
                onChange={(e) => setProvinceFilter(e.target.value)}
                className="w-full p-3 border rounded mb-4"
              >
                <option>All</option>
                <option>Gauteng</option>
                <option>Western Cape</option>
                <option>KZN</option>
                <option>Limpopo</option>
              </select>

              <div className="grid md:grid-cols-2 gap-4">
                {filteredClinics.map(clinic => (
                  <div key={clinic.id} className="border p-4 rounded-lg">
                    <h3 className="font-bold">{clinic.name}</h3>
                    <p className="text-sm text-gray-600">{clinic.city}, {clinic.province}</p>
                    <div className="mt-2 space-y-1 text-sm">
                      <p>⏱️ Queue: {clinic.queue} people</p>
                      <p>👨‍⚕️ Staff on duty: {clinic.doctors}</p>
                      <p className={`font-semibold ${clinic.medsInStock?'text-green-600':'text-red-600'}`}>
                        💊 Meds: {clinic.medsInStock? 'In Stock' : 'Low/Out'}
                      </p>
                    </div>
                    <div className="flex gap-2 mt-3">
                      <button
                        onClick={() => bookSlot(clinic.id, false)}
                        disabled={!clinic.medsInStock}
                        className="flex-1 bg-blue-600 text-white py-2 rounded text-sm disabled:bg-gray-400"
                      >
                        Book Slot
                      </button>
                      <button
                        onClick={() => bookSlot(clinic.id, true)}
                        disabled={!clinic.medsInStock}
                        className="flex-1 bg-purple-600 text-white py-2 rounded text-sm disabled:bg-gray-400"
                      >
                        Spaza Pickup
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {bookings.length > 0 && (
              <div className="bg-white p-6 rounded-lg shadow">
                <h3 className="font-bold mb-4">My Bookings & Pickups</h3>
                {bookings.filter(b=>b.userId===user?.fileId).map(b => {
                  const clinic = clinics.find(c => c.id === b.clinicId);
                  return (
                    <div key={b.id} className="border-l-4 border-green-500 pl-4 py-2 mb-2">
                      <p className="font-semibold">{clinic.name}</p>
                      <p className="text-sm">Type: {b.deliveryType}</p>
                      <p className="text-sm">Time: {b.time} | QR: {b.qr}</p>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {view === 'clinic' && (
          <div className="bg-white p-6 rounded-lg shadow">
            <h2 className="text-xl font-bold mb-4">Clinic Dashboard</h2>
            
            <select
              onChange={(e) => setSelectedClinic(clinics.find(c => c.id == e.target.value))}
              className="w-full p-3 border rounded mb-4"
            >
              <option>Select Clinic</option>
              {clinics.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>

            {selectedClinic && (
              <div>
                <div className="grid md:grid-cols-3 gap-4 mb-4">
                  <div className="bg-blue-50 p-4 rounded">
                    <p className="text-sm text-gray-600">Queue</p>
                    <p className="text-2xl font-bold">{selectedClinic.queue}</p>
                  </div>
                  <div className="bg-green-50 p-4 rounded">
                    <p className="text-sm text-gray-600">Staff on Duty</p>
                    <p className="text-2xl font-bold">{selectedClinic.doctors}</p>
                  </div>
                  <div className={`p-4 rounded ${selectedClinic.medsInStock?'bg-green-50':'bg-red-50'}`}>
                    <p className="text-sm text-gray-600">Meds Stock</p>
                    <p className="text-2xl font-bold">{selectedClinic.medsInStock?'OK':'LOW'}</p>
                  </div>
                </div>

                <div className="flex gap-2 flex-wrap mb-6">
                  <button onClick={() => markSeen(selectedClinic.id)} className="bg-green-600 text-white px-4 py-2 rounded">
                    Mark Patient Seen
                  </button>
                  <button onClick={() => updateStock(selectedClinic.id,!selectedClinic.medsInStock)} className="bg-orange-600 text-white px-4 py-2 rounded">
                    Update Stock
                  </button>
                  <button onClick={() => {
                    setStaffLog([...staffLog, {time: new Date().toLocaleTimeString(), clinic: selectedClinic.name, staff: 'Nurse A', status: 'Shift Start'}]);
                    alert('Shift logged. Incentive points added.');
                  }} className="bg-purple-600 text-white px-4 py-2 rounded">
                    Log Shift Start
                  </button>
                </div>
                <p className="text-xs text-gray-600">Note: Shift logging is for workload tracking and performance incentives, not punishment.</p>

                <h3 className="font-bold mb-2 mt-6">Staff Shift Log</h3>
                <div className="bg-gray-50 p-3 rounded max-h-40 overflow-y-auto">
                  {staffLog.filter(s=>s.clinic===selectedClinic.name).map((s,i)=>(
                    <p key={i} className="text-sm">{s.time} - {s.staff} {s.status}</p>
                  ))}
                  {staffLog.filter(s=>s.clinic===selectedClinic.name).length===0 && <p className="text-sm text-gray-500">No shifts logged yet</p>}
                </div>
              </div>
            )}
          </div>
        )}

        {view === 'doh' && (
          <div className="bg-white p-6 rounded-lg shadow">
            <h2 className="text-xl font-bold mb-4">DOH National Dashboard</h2>
            
            <div className="bg-green-50 border-green-300 p-4 rounded mb-4">
              <p className="text-sm font-semibold">ROI Tracker</p>
              <p className="text-2xl font-bold text-green-700">R{savedRands.toLocaleString()}</p>
              <p className="text-xs">Estimated cost saved from reduced queues & overtime</p>
            </div>

            <div className="grid md:grid-cols-4 gap-4 mb-6">
              <div className="bg-blue-50 p-4 rounded">
                <p className="text-sm text-gray-600">Total Clinics</p>
                <p className="text-2xl font-bold">{clinics.length}</p>
              </div>
              <div className="bg-red-50 p-4 rounded">
                <p className="text-sm text-gray-600">Stockouts</p>
                <p className="text-2xl font-bold">{clinics.filter(c=>!c.medsInStock).length}</p>
              </div>
              <div className="bg-orange-50 p-4 rounded">
                <p className="text-sm text-gray-600">Avg Queue</p>
                <p className="text-2xl font-bold">{Math.round(clinics.reduce((a,b)=>a+b.queue,0)/clinics.length)}</p>
              </div>
              <div className="bg-purple-50 p-4 rounded">
                <p className="text-sm text-gray-600">Pickups</p>
                <p className="text-2xl font-bold">{bookings.filter(b=>b.deliveryType==='Spaza Pickup').length}</p>
              </div>
            </div>

            <div className="flex gap-2 mb-4">
              <button onClick={syncDHIS2} className="bg-blue-600 text-white px-4 py-2 rounded">
                Sync with DHIS2
              </button>
              <button className="bg-gray-600 text-white px-4 py-2 rounded">
                Export for Treasury Report
              </button>
            </div>

            <h3 className="font-bold mb-2">Anti-Theft Stock Log</h3>
            <div className="bg-gray-50 p-3 rounded max-h-48 overflow-y-auto mb-4">
              {stockLog.map((log,i)=>(
                <p key={i} className="text-sm border-b py-1">{log.time} | {log.clinic} | {log.action}</p>
              ))}
              {stockLog.length===0 && <p className="text-sm text-gray-500">No stock changes yet</p>}
            </div>

            <h3 className="font-bold mb-2">Stock Alerts</h3>
            <table className="w-full text-sm">
              <thead className="bg-gray-100">
                <tr>
                  <th className="text-left p-2">Clinic</th>
                  <th className="text-left p-2">Province</th>
                  <th className="text-left p-2">Status</th>
                </tr>
              </thead>
              <tbody>
                {clinics.filter(c=>!c.medsInStock).map(c => (
                  <tr key={c.id} className="border-t">
                    <td className="p-2">{c.name}</td>
                    <td className="p-2">{c.province}</td>
                    <td className="p-2 text-red-600 font-semibold">Meds Out of Stock</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </main>

      <footer className="text-center p-4 text-gray-500 text-sm mt-8">
        <p>CliniqueConnect Prototype v2.0 | POPIA Compliant | Data Residency: AWS Cape Town</p>
        <p className="text-xs mt-1">This is not a medical device. For emergencies call 112.</p>
      </footer>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
